name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite is stable and flag-free from the 22.13 line onward.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Show Node version
        run: node --version
      - name: Syntax-check server sources
        run: |
          node --check server/server.js
          node --check server/smoke-test.js
      - name: Run smoke test
        run: npm test
